<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="img/flowers.png" type="image/x-icon" />
    <title>Our Story</title>
  </head>
  <body class="container">
    <audio src="sound/ChristianBasso&HaienQiu-Flowers.mp3" autoplay></audio>
    <div id="story-text"></div>
    <h1 class="titulo">Todo comenzo con un simple mensaje...<br><br>
      Un 23 de junio, a las 11:30 de la noche.</h1>

    <!-- Timer section -->
    <div class="timer-section">
      <div class="timer-title">Tiempo juntos</div>
      <div class="timer-counters">
        <div class="timer-item">
          <span class="timer-number" id="days">0</span>
          <span class="timer-label">dias</span>
        </div>
        <div class="timer-item">
          <span class="timer-number" id="hours">0</span>
          <span class="timer-label">horas</span>
        </div>
        <div class="timer-item">
          <span class="timer-number" id="minutes">0</span>
          <span class="timer-label">minutos</span>
        </div>
        <div class="timer-item">
          <span class="timer-number" id="seconds">0</span>
          <span class="timer-label">segundos</span>
        </div>
      </div>
    </div>

    <div class="night"></div>

    <!-- Petalos cayendo -->
    <div class="falling-petals">
      <div class="petal petal--1"></div>
      <div class="petal petal--2"></div>
      <div class="petal petal--3"></div>
      <div class="petal petal--4"></div>
      <div class="petal petal--5"></div>
      <div class="petal petal--6"></div>
      <div class="petal petal--7"></div>
      <div class="petal petal--8"></div>
      <div class="petal petal--9"></div>
      <div class="petal petal--10"></div>
      <div class="petal petal--11"></div>
      <div class="petal petal--12"></div>
    </div>

    <!-- Tulipanes -->
    <div class="tulips">
      <div class="tulip tulip--1">
        <div class="tulip__petals">
          <div class="tulip__petal tulip__petal--left"></div>
          <div class="tulip__petal tulip__petal--center"></div>
          <div class="tulip__petal tulip__petal--right"></div>
        </div>
        <div class="tulip__stem"></div>
        <div class="tulip__leaf tulip__leaf--left"></div>
        <div class="tulip__leaf tulip__leaf--right"></div>
      </div>
      <div class="tulip tulip--2">
        <div class="tulip__petals">
          <div class="tulip__petal tulip__petal--left"></div>
          <div class="tulip__petal tulip__petal--center"></div>
          <div class="tulip__petal tulip__petal--right"></div>
        </div>
        <div class="tulip__stem"></div>
        <div class="tulip__leaf tulip__leaf--left"></div>
      </div>
      <div class="tulip tulip--3">
        <div class="tulip__petals">
          <div class="tulip__petal tulip__petal--left"></div>
          <div class="tulip__petal tulip__petal--center"></div>
          <div class="tulip__petal tulip__petal--right"></div>
        </div>
        <div class="tulip__stem"></div>
        <div class="tulip__leaf tulip__leaf--right"></div>
      </div>
    </div>

    <!-- Capullos de rosa -->
    <div class="rosebuds">
      <div class="rosebud rosebud--1">
        <div class="rosebud__bud">
          <div class="rosebud__petal rosebud__petal--1"></div>
          <div class="rosebud__petal rosebud__petal--2"></div>
          <div class="rosebud__petal rosebud__petal--3"></div>
          <div class="rosebud__sepal rosebud__sepal--1"></div>
          <div class="rosebud__sepal rosebud__sepal--2"></div>
        </div>
        <div class="rosebud__stem"></div>
      </div>
      <div class="rosebud rosebud--2">
        <div class="rosebud__bud">
          <div class="rosebud__petal rosebud__petal--1"></div>
          <div class="rosebud__petal rosebud__petal--2"></div>
          <div class="rosebud__petal rosebud__petal--3"></div>
          <div class="rosebud__sepal rosebud__sepal--1"></div>
          <div class="rosebud__sepal rosebud__sepal--2"></div>
        </div>
        <div class="rosebud__stem"></div>
      </div>
      <div class="rosebud rosebud--3">
        <div class="rosebud__bud">
          <div class="rosebud__petal rosebud__petal--1"></div>
          <div class="rosebud__petal rosebud__petal--2"></div>
          <div class="rosebud__petal rosebud__petal--3"></div>
          <div class="rosebud__sepal rosebud__sepal--1"></div>
          <div class="rosebud__sepal rosebud__sepal--2"></div>
        </div>
        <div class="rosebud__stem"></div>
      </div>
    </div>

    <div class="flowers">
      <div class="flower flower--1">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>

          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
          <div class="flower__line__leaf flower__line__leaf--5"></div>
          <div class="flower__line__leaf flower__line__leaf--6"></div>
        </div>
      </div>

      <div class="flower flower--2">
        <div class="flower__leafs flower__leafs--2">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>

          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
        </div>
      </div>

      <div class="flower flower--3">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>

          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
        </div>
      </div>
    </div>
    <script src="anim.js"></script>
    <script src="main.js"></script>
  </body>
</html>
